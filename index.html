  H.length = H0; PV.length = P0;
}
function logHTML() { return G.logs.map(l => `<p class="${l.cls}">${esc(l.t)}</p>`).join(''); }
function renderGame() {
  const logEl = document.getElementById('log');
  const prevScroll = logEl ? logEl.scrollTop : 0;
  const me = ME(), bot = BOT();
  app.innerHTML = `<div class="game" style="--mc:${hcol(me.deckId)};--oc:${hcol(bot.deckId)}">
    <div class="mat"><div class="matart o art" style="${artStyle(bot.hero.img)}"></div><div class="matart m art" style="${artStyle(me.hero.img)}"></div>
      ${oppZone(bot)}${midHTML()}<div class="bar" id="bar">${barHTML()}</div>${myZone(me)}</div>
    <aside class="side"><div class="pv" id="pv"></div><div class="log" id="log" aria-live="polite">${logHTML()}</div>
      <div class="sidefoot"><button class="btn quiet small" data-h="${h(() => { pend = null; G = null; view = 'setup'; render(); })}">Abandonner et revenir au réglage</button>
        <button class="btn quiet small" data-h="${h(() => { cfg.anim = cfg.anim === false; saveCfg(); render(); })}">Animations : ${cfg.anim === false ? 'non' : 'oui'}</button></div></aside>
  </div>`;
  renderPreview();
  const nl = document.getElementById('log');
  nl.scrollTop = logStick ? nl.scrollHeight : prevScroll;
  fxAfter();
}

/* ---------- Barre d'action ---------- */
function btn(label, fn, o = {}) { return `<button class="btn ${o.primary ? 'primary' : ''} ${o.quiet ? 'quiet' : ''}" ${o.disabled ? 'disabled' : ''} data-h="${h(fn)}">${label}</button>`; }
function optLabel(o) {
  if (o.type === 'play') {
    const c = o.card;
    if (c.t === 'AA') return `Attaquer avec ${esc(c.n)}${o.from === 'ars' ? ' (arsenal)' : o.from === 'ban' ? ' (banni)' : o.from === 'oban' ? ' (bannie adverse)' : ''} (coût ${o.cost})`;
    if (c.t === 'AR') return `${esc(c.n)} : ${esc(o.modeLabel || '')} (coût ${o.cost})`;
    if (c.staunch) return `${esc(c.n)}${o.from === 'ars' ? ' depuis l’arsenal' : ''} (défense ${c.def} ou ${c.def + 3}, coût ${o.cost} ou ${o.cost + 4})`;
    return `Jouer ${esc(c.n)}${o.from === 'ars' ? ' depuis l’arsenal' : o.from === 'ban' ? ' (banni)' : o.from === 'oban' ? ' (bannie adverse)' : ''}${o.inst ? ' comme un instant' : ''} (coût ${o.cost})`;
  }
  if (o.type === 'disc') return `Défausser ${esc(o.card.n)} : amp ${o.card.discAmp}`;
  if (o.type === 'wab') return `${esc(o.w.abil.label)} (coût ${o.cost})`;
  if (o.type === 'item') return o.it.itemAbil ? `${esc(o.it.n)} : ${esc(o.it.itemAbil.label)} (coût ${o.cost})` : `Détruire ${esc(o.it.n)} : +2 ressources`;
  if (o.type === 'weapon') return `Attaquer avec ${esc(o.w.n)} (coût ${o.cost})`;
  if (o.type === 'ally') return `Attaquer avec ${esc(o.ally.n)}`;
  if (o.type === 'hero') { const ab = ME().hero.ability; return `${esc(ab.label)} (coût ${ab.chi ? ab.chi + ' chi' : o.cost})`; }
  if (o.type === 'eq') return `${esc(F.EQ[o.e.n].abil.label)}${o.cost ? ` (coût ${o.cost})` : ''}`;
  return o.type;
}
function prioPrompt(ctx) {
  const me = ME(), bot = BOT();
  const top = G.stack[G.stack.length - 1];
  const L = ctx.L;
  const pw = L ? `${F.linkPower(G, L)} contre ${F.linkDefense(G, L)}` : '';
  if (top) return `Sur la pile : <b>${esc(top.label)}</b> (${esc(top.owner.name)}). Tu peux répondre ou passer pour la laisser se résoudre.`;
  if (ctx.step === 'action') return `Ton tour : <b>${me.res}</b> ressource${me.res > 1 ? 's' : ''}, <b>${me.ap}</b> point${me.ap > 1 ? 's' : ''} d’action. Choisis une carte, ton arme, une capacité, ou termine ta phase d’action.`;
  if (ctx.step === 'resolution') return G.active === 0
    ? `Maillon résolu. Attaque à nouveau (<b>${me.ap}</b> action${me.ap > 1 ? 's' : ''}) ou passe : la chaîne se fermera.`
    : `Fin du maillon du bot. Tu peux jouer un instant ou passer.`;
  if (ctx.step === 'reaction') return L.owner === me ? `Réactions sur ton attaque : ${pw}. Joue une attack reaction ou passe.` : `${esc(bot.name)} attaque : ${pw}. Joue une defense reaction ou passe.`;
  if (ctx.step === 'attack' && L && L.owner !== me && L.dominate) return `${esc(bot.name)} attaque avec dominate (${F.linkPower(G, L)}). Tu peux retirer dominate avant de défendre, ou passer.`;
  return `${STEPFR[ctx.step]} (${pw}). Tu peux jouer un instant ou passer.`;
}
function barHTML() {
  const me = ME();
  if (G.over) return `<div class="prompt">Partie terminée.</div><div class="btns">${btn('Rejouer', () => startGame(), { primary: true })}${btn('Changer de deck', () => { overlay.innerHTML = ''; view = 'setup'; G = null; render(); })}</div>`;
  if (!pend) return `<div class="prompt thinking">${esc(thinking || 'Le bot joue…')}</div>`;
  if (pend.kind === 'prio') {
    const o = pend.opts, ctx = pend.ctx;
    const btns = [];
    if (sel) for (const x of optsFor(sel)) btns.push(btn(optLabel(x), () => pend.resolve(x), { primary: true }));
    for (const x of o.filter(x => ['hero', 'weapon', 'eq', 'ally', 'wab', 'item'].includes(x.type))) btns.push(btn(optLabel(x), () => pend.resolve(x)));
    if (!sel) for (const x of o.filter(x => x.type === 'play' && (x.card.t === 'AR' || x.card.t === 'DR'))) btns.push(btn(optLabel(x), () => pend.resolve(x)));
    const own = G.active === 0 && !G.stack.length && (ctx.step === 'action' || ctx.step === 'resolution');
    btns.push('<span class="sp"></span>');
    btns.push(btn(own ? (ctx.step === 'action' ? 'Fin de ma phase d’action' : 'Passer (fermer la chaîne)') : 'Passer', () => pend.resolve(null), { quiet: !own }));
    if (!own && o.every(isInstantOpt)) btns.push(btn('Passer jusqu’à la fin du tour', () => { skipTurn = G.turn; pend.resolve(null); }, { quiet: true }));
    return `<div class="prompt">${prioPrompt(ctx)}${!sel && o.some(x => x.type === 'play' && x.card.t !== 'AR' && x.card.t !== 'DR') ? ' <span class="muted">Les cartes jouables sont surlignées : touche-en une.</span>' : ''}</div><div class="btns">${btns.join('')}</div>`;
  }
  if (pend.kind === 'pay') {
    const got = pend.picks.reduce((s, c) => s + c.p, 0);
    return `<div class="prompt">Paie <b>${pend.need}</b> pour ${esc(pend.label || '')} : touche les cartes de ta main à pitcher (sélection : <b>${got}</b>).</div>
      <div class="btns">${btn(got >= pend.need ? 'Pitcher et payer' : `Encore ${pend.need - got} à trouver`, () => pend.resolve(pend.picks.slice()), { primary: true, disabled: got < pend.need })}${btn('Annuler', () => pend.cancel(), { quiet: true })}</div>`;
  }
  if (pend.kind === 'defend') {
    const L = pend.L;
    const nCards = pend.hand.length + (pend.ars && me.ars ? 1 : 0);
    const pow = Math.max(0, F.linkPower(G, L) - (L.src.stony && nCards >= 2 ? 1 : 0));
    const d = pend.hand.reduce((s, c) => s + F.defenderDef(G, { card: c }, L), 0) + (pend.ars && me.ars ? F.defenderDef(G, { card: me.ars }, L) : 0) + pend.eq.reduce((s, sl) => s + F.eqDef(G, me, me.eq[sl], L) + (pend.hand.length && F.EQ[me.eq[sl].n].unity ? 1 : 0), 0);
    const shield = F.sum(me.shields.filter(s => s.turn === G.turn && s.src === (L.isWeapon ? L.weapon : L.src)), s => s.left);
    const dmg = Math.max(0, pow - d - shield);
    const notes = [];
    if (shield) notes.push(`Oasis Respite empêchera encore ${shield} dégât(s) de cette source.`);
    if (L.src.defNote) notes.push(L.src.defNote);
    if (L.hitAnyFx.length) notes.push('Si elle touche : ' + L.hitAnyFx.map(x => x.why).join(', ') + '.');
    if (F.defendOptions(G, me, L).ars) notes.push('Ambush : ta carte d’arsenal peut défendre (touche-la).');
    if (L.dominate) notes.push('Dominate : une seule carte de ta main.');
    if (L.src.crush) notes.push(`Crush si tu subis 4 ou plus (${L.src.n} : survole la carte pour l’effet).`);
    if (L.isWeapon && L.weapon.onHit) notes.push('Si elle touche : clash (Miller’s Grindstone).');
    if (L.isWeapon && L.weapon.halve && L.weapon.halvedTurn !== G.turn) notes.push('Decimator : la première carte non-équipement qui défend ce tour voit sa défense de base divisée par deux (choix de l’attaquant).');
    if (L.isWeapon && L.owner.hasReprise) notes.push('Reprise : si tu défends avec une carte de ta main, Overpower et Ironsong Response sont plus forts.');
    if (L.isWeapon && L.owner.hero.onWeaponHit && L.owner.dorTurn !== G.turn && L.owner.noAbil <= 0) notes.push('Si elle touche, Dorinthea pourra attaquer une fois de plus avec sa hache.');
    if (pend.eq.some(sl => F.EQ[me.eq[sl].n].unity)) notes.push('Unity : +1 aux équipements Unity si une carte de ta main défend avec eux.');
    if (L.hitFx.length) notes.push('Si elle touche : ' + L.hitFx.map(x => x.why).join(', ') + '.');
    return `<div class="prompt">${esc(L.owner.name)} attaque avec ${esc(L.isWeapon ? L.src.n : F.cname(L.src))} : puissance <b>${pow}</b>. Choisis tes bloqueurs (main et équipement) : défense <b>${d}</b>, tu subirais <b>${dmg}</b>. ${notes.length ? `<span class="muted">${esc(notes.join(' '))}</span>` : ''}</div>
      <div class="btns">${btn(pend.hand.length || pend.eq.length || pend.ars ? 'Valider la défense' : 'Ne pas bloquer', () => pend.resolve({ hand: pend.hand.slice(), eq: pend.eq.slice(), ars: !!pend.ars }), { primary: true })}</div>`;
  }
  if (pend.kind === 'choose') return `<div class="prompt">${esc(pend.title)}</div><div class="btns">${pend.opts.map((o, i) => btn(esc(o.label), () => pend.resolve(o), { primary: i === 0 })).join('')}</div>`;
  if (pend.kind === 'pick') return `<div class="prompt">${esc(pend.title)} : touche une carte de ta main.</div>`;
  if (pend.kind === 'many') return `<div class="prompt">${esc(pend.title)} : touche les cartes (sélection : <b>${pend.picked.length}</b> / ${pend.max}).</div><div class="btns">${btn(pend.picked.length ? 'Valider' : 'Ne rien mettre', () => pend.resolve(pend.picked.slice()), { primary: true })}</div>`;
  if (pend.kind === 'putback') return `<div class="prompt">Remets <b>${pend.X}</b> carte(s) sur ton deck : touche-les dans l’ordre (la première touchée sera sur le dessus).</div>`;
  if (pend.kind === 'arsenal') return `<div class="prompt">Fin de tour : touche une carte de ta main pour la mettre face cachée en arsenal.</div><div class="btns">${btn('Ne rien mettre en arsenal', () => pend.resolve(null), { quiet: true })}</div>`;
  if (pend.kind === 'order') {
    const cards = pend.cards.map(c => {
      const i = pend.picked.indexOf(c);
      return cardHTML(c, { size: 'mini', on: i >= 0, playable: i < 0, badgeTL: i >= 0 ? String(i + 1) : '', h: h(() => { i >= 0 ? pend.picked.splice(i, 1) : pend.picked.push(c); if (pend.picked.length === pend.cards.length - 1) pend.picked.push(pend.cards.find(x => !pend.picked.includes(x))); render(); }) });
    }).join('');
    const done = pend.picked.length === pend.cards.length;
    return `<div class="prompt">${pend.title ? esc(pend.title) + ' : touche-les dans l’ordre.' : 'Tes cartes pitchées retournent sous ton deck. Touche-les dans l’ordre où tu veux les repiocher (la n°1 sera piochée en premier).'}</div>
      <div class="btns"><div class="order">${cards}</div><span class="sp"></span>${btn('Valider cet ordre', () => pend.resolve(pend.picked.slice()), { primary: true, disabled: !done })}${btn(pend.title ? 'Garder cet ordre' : 'Garder l’ordre de pitch', () => pend.resolve(pend.cards.slice()), { quiet: true })}${pend.picked.length ? btn('Recommencer', () => { pend.picked = []; render(); }, { quiet: true }) : ''}</div>`;
  }
  return '';
}

// Pour les tests automatiques
window.__bot = { get G() { return G; }, get pend() { return pend; }, startGame, cfg: () => cfg, imgKey };
render();
})();

</script>
