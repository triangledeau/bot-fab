<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Bot d’entraînement FaB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Sofia+Sans+Semi+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Habillage « Tapis d'arène » (11 nov. 2026) : l'art des deux héros sert de tapis, zones tracées comme sur un playmat
   (équipement, armes, héros, arsenal, pitch, deck, cimetière, banni), chaîne de combat au centre, main en éventail en bas,
   chaque côté à la couleur de son héros (--mc : toi, --oc : bot). Thème sombre uniquement. Aperçu de carte et journal à droite. */
:root {
  --bg: #0a0d13; --mat: #0e1219; --surface: #121722; --ink: #efe5cf; --muted: #a9a595; --line: rgb(239 229 207 / .28);
  --primary: #efe5cf; --primary-ink: #14110c; --brass: #ffd84a; --brass-soft: rgb(255 216 74 / .12);
  --red: #e0574a; --yellow: #e6b422; --blue: #4f8fe0; --good: #63c98b; --dmg: #ff8a78;
  --glow: #ffe08a; --mc: #c9a24a; --oc: #c9483c;
  --shadow: 0 2px 6px rgb(0 0 0 / .65);
  --f-display: "Cinzel", "Palatino Linotype", Georgia, serif;
  --f-body: "Sofia Sans Semi Condensed", "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  /* Tailles de cartes calculées sur la hauteur de l'écran (format 63 × 88 mm) */
  --fh: clamp(74px, 13vh, 142px);            /* cartes du tapis */
  --hh: clamp(108px, 19.5vh, 200px);         /* cartes de la main */
  --ch: var(--fh); --mh: calc(var(--ch) * .56); --uh: calc((var(--ch) - 4px) / 2);
  --side: clamp(240px, 21vw, 310px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.35; overflow: hidden; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; text-wrap: balance; margin: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.btn { border: 1px solid var(--line); background: rgb(8 10 15 / .6); color: var(--ink); border-radius: 999px; padding: 6px 16px; cursor: pointer; min-height: 36px; font-weight: 700; transition: transform .12s, filter .12s, border-color .12s; }
.btn:hover { border-color: var(--ink); transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .cd:focus-visible, .tile:focus-visible, .pile:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); box-shadow: 0 0 20px rgb(255 224 138 / .3); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.quiet { background: transparent; }
.btn.small { min-height: 28px; padding: 3px 12px; font-size: .85rem; font-weight: 600; }
.art { background-image: var(--art); background-repeat: no-repeat; background-size: 131.6% auto; background-position: 50% 24.1%; }

/* ---------- Écran de jeu ---------- */
#app { height: 100%; }
.game { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: minmax(0, 1fr); }
.mat { position: relative; overflow: hidden; isolation: isolate; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto auto auto auto; padding: 0 max(16px, env(safe-area-inset-left, 0px)) 0; }
.matart { position: absolute; z-index: -2; width: min(62%, 98vh); aspect-ratio: 1.295; filter: saturate(1.1) blur(.6px); opacity: .6; pointer-events: none;
  -webkit-mask-image: radial-gradient(closest-side, #000 35%, transparent); mask-image: radial-gradient(closest-side, #000 35%, transparent); }
.matart.o { right: -2%; top: -8%; } .matart.m { left: -2%; bottom: -10%; }
.mat::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, color-mix(in srgb, var(--oc) 22%, transparent), transparent 38%, transparent 62%, color-mix(in srgb, var(--mc) 24%, transparent)), radial-gradient(ellipse at 50% 50%, transparent 30%, rgb(4 6 10 / .84)); }

/* Rangée d'un joueur : zones du playmat */
.field { --c: var(--mc); display: flex; align-items: flex-end; justify-content: safe center; gap: clamp(6px, .9vw, 18px); padding: 8px 2px 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.field.o { --c: var(--oc); align-items: flex-start; padding: 8px 2px 4px; }
.slot, .field .grp { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: none; }
.field.o .slot, .field.o .grp { flex-direction: column-reverse; }
.slot > i, .field .lab { font: 600 .6rem/1 var(--f-display); font-style: normal; letter-spacing: .14em; color: var(--muted); white-space: nowrap; text-transform: none; }
.well { position: relative; border: 1px solid var(--line); border-radius: 7px; padding: 3px; background: rgb(6 8 12 / .5); display: flex; gap: 3px; align-items: center; }
.herowell { border: 2px solid var(--c); box-shadow: 0 0 22px color-mix(in srgb, var(--c) 55%, transparent), inset 0 0 12px color-mix(in srgb, var(--c) 30%, transparent); }
.herowell .cd { --h: calc(var(--fh) * 1.1); }
.field.active .herowell { animation: heroglow 2.4s ease-in-out infinite; }
.eq, .allies { display: grid; grid-template-rows: repeat(2, auto); grid-auto-flow: column; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 7px; background: rgb(6 8 12 / .5); }
.piles { display: flex; flex-direction: column; gap: 4px; }
.piles .pile { padding: 2px; cursor: default; }
.piles button.pile { cursor: pointer; } .piles button.pile:hover { border-color: var(--ink); }
.piles .col { display: flex; flex-direction: column; gap: 4px; }
.n { position: absolute; right: -7px; top: -7px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--ink); color: #111; font: 700 .74rem/20px var(--f-body); text-align: center; padding: 0 5px; z-index: 3; }
.cards { display: flex; gap: 4px; align-items: flex-end; }
.fan { display: flex; align-items: flex-end; }
.fan > .cd + .cd { margin-left: calc(var(--h) * -.5); }
.fan > .cd:hover { z-index: 3; }
.empty { width: calc(var(--ch) * .716); height: var(--ch); border-radius: 5px; display: grid; place-items: center; color: rgb(239 229 207 / .3); font: 600 .56rem/1.2 var(--f-display); letter-spacing: .08em; text-align: center; padding: 2px; }
.piles .empty { width: calc(var(--uh) * .716); height: var(--uh); font-size: .46rem; }
.dial { position: relative; flex: none; width: calc(var(--fh) * .62); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; align-self: center;
  background: radial-gradient(closest-side, #0b0e14 78%, transparent 80%), conic-gradient(var(--c) calc(var(--p) * 1%), rgb(255 255 255 / .14) 0); box-shadow: 0 0 18px color-mix(in srgb, var(--c) 45%, transparent); }
.dial b { font: 800 calc(var(--fh) * .22)/1 var(--f-display); color: #fff; translate: 0 -10%; }
.dial small { position: absolute; bottom: 14%; font-size: .56rem; color: var(--muted); }
.name { align-self: center; flex: none; width: clamp(92px, 9vw, 150px); display: flex; flex-direction: column; gap: 2px; }
.name > b { font: 800 clamp(.95rem, 1.2vw, 1.2rem)/1.05 var(--f-display); color: var(--ink); text-shadow: 0 2px 8px #000; }
.name > span { font-size: .8rem; color: var(--c); font-weight: 700; filter: brightness(1.35); }
.name em { font-style: normal; font-size: .78rem; color: var(--muted); }
.name em.act { color: var(--brass); font-weight: 700; }
.resap { display: flex; gap: 10px; margin-top: 3px; font: 600 .95rem/1 var(--f-num); }
.resap span { display: inline-flex; align-items: center; gap: 4px; }
.resap i { width: 11px; height: 11px; display: inline-block; }
.resap .rs { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffb3a6, var(--red) 55%, #6b1a12); }
.resap .ap { background: var(--brass); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.pills { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; padding: 0 4px; min-height: 0; }
.pill { border-radius: 999px; padding: 1px 9px; font-size: .78rem; background: rgb(8 10 15 / .75); border: 1px solid var(--line); white-space: nowrap; }
.pill b { font-family: var(--f-num); }
.pill.warn { border-color: var(--dmg); color: var(--dmg); }
.pill.buff { border-color: var(--brass); color: var(--brass); }

/* ---------- Cartes ---------- */
.cd { --h: var(--ch); --pc: var(--line); position: relative; flex: 0 0 auto; height: var(--h); width: calc(var(--h) * .716); border-radius: calc(var(--h) * .045);
  background: #1b2029; border: 0; box-shadow: var(--shadow); overflow: hidden; cursor: default; container-type: size; color: var(--ink); text-align: left; padding: 0;
  transition: transform .2s cubic-bezier(.2, .8, .2, 1), box-shadow .2s, filter .2s; }
.cd.mini { --h: var(--mh); }
.cd.micro { --h: var(--uh); }
.cd.p1 { --pc: var(--red); } .cd.p2 { --pc: var(--yellow); } .cd.p3 { --pc: var(--blue); }
.cd img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; max-width: none; }
.face { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 2cqh; padding: 5cqh 6cqw 4cqh 10cqw; }
.face::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5cqw; background: var(--pc); }
.f-top { display: flex; justify-content: space-between; align-items: center; font-family: var(--f-num); font-size: 9cqh; line-height: 1; }
.f-pips { display: flex; gap: 2cqw; }
.f-pips i { width: 6cqh; height: 6cqh; border-radius: 50%; background: var(--pc); }
.f-nm { font-family: var(--f-display); font-weight: 800; font-size: 9.5cqh; line-height: 1.05; overflow-wrap: anywhere; }
.f-ty { font-size: 7cqh; color: var(--muted); line-height: 1.1; }
.f-kw { font-size: 7cqh; color: var(--brass); font-weight: 700; line-height: 1.1; }
.f-bot { margin-top: auto; display: flex; justify-content: space-between; font-family: var(--f-num); font-weight: 600; font-size: 11cqh; line-height: 1; }
.cd.micro .f-ty, .cd.micro .f-kw { display: none; }
.cd.micro .f-nm { font-size: 12cqh; }
.cd .bdg { position: absolute; right: 3px; bottom: 3px; z-index: 2; font: 600 .68rem/1 var(--f-num); background: rgb(8 10 15 / .88); color: #fff; border: 1px solid var(--brass); border-radius: 999px; padding: 2px 5px; display: inline-flex; align-items: center; gap: 2px; }
.cd.micro .bdg { font-size: .6rem; right: 1px; bottom: 1px; padding: 1px 4px; max-width: calc(100% - 2px); }
.cd .bdg.tl { right: auto; left: 3px; bottom: auto; top: 3px; border-color: var(--line); }
.cd.click { cursor: pointer; }
.cd.playable { box-shadow: 0 0 0 2px var(--glow), 0 0 12px 2px var(--glow); animation: pulse 1.8s infinite; }
.cd.click:hover { transform: translateY(-4px) scale(1.05); z-index: 4; }
.cd.sel { transform: translateY(-8px); box-shadow: 0 0 0 3px var(--mc), 0 0 22px 4px var(--mc); animation: none; }
.cd.on { box-shadow: 0 0 0 3px var(--good), 0 0 18px 3px var(--good); animation: none; }
.cd.on::after { content: ""; position: absolute; inset: 0; background: color-mix(in srgb, var(--good) 20%, transparent); }
.cd.dim { filter: brightness(.45) saturate(.6); }
.cd.dead { opacity: .3; filter: grayscale(1); }
.cd.used { filter: brightness(.6) saturate(.7); }
.cd.tapped { filter: brightness(.65); }
.cd.back { background: url("https://images.talishar.net/public/cardimages/english/CardBack.webp") center / cover, radial-gradient(circle at 50% 50%, #7a2318 0 18%, #2a0f0c 19% 30%, #14100e 31%); border: 1px solid #3a2f22; }

/* ---------- Centre : chaîne de combat et pile ---------- */
.mid { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; min-height: 0; padding: 2px 0; }
.mid::before { content: ""; position: absolute; left: 3%; right: 3%; top: 50%; height: 1px; background: linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent); z-index: -1; }
.mid-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.mhead { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.turnmark { font: 600 .66rem/1 var(--f-display); letter-spacing: .12em; color: var(--muted); background: var(--bg); border: 1px solid var(--line); padding: 5px 10px; border-radius: 3px; display: inline-flex; align-items: baseline; gap: 6px; }
.turnmark b { font-size: 1.15rem; color: var(--ink); }
.step { font: 800 .82rem/1.2 var(--f-display); color: var(--brass); text-align: right; }
.links { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: safe center; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; container-type: size; padding: 0 8px; }
.lk { flex: none; display: flex; align-items: center; gap: 10px; --lc: var(--oc); --mh: clamp(64px, calc(100cqh - 14px), 214px); }
.lk.mine { --lc: var(--mc); }
.lk.old { --mh: clamp(56px, calc((100cqh - 14px) * .74), 158px); }
.lk.old .lkc > .cd { filter: brightness(.62); } .lk.old .lkc > .cd:hover { filter: none; }
.lkc { display: flex; align-items: center; }
.lk.cur .lkc > .cd { box-shadow: 0 0 0 2px var(--lc), 0 0 34px 6px color-mix(in srgb, var(--lc) 70%, transparent); }
.lk.enter .lkc > .cd { animation: drop .6s var(--ad, 0ms) cubic-bezier(.2, .8, .2, 1) both; }
.lk.enter.mine .lkc > .cd { animation-name: rise; }
.lk .defs { display: flex; margin-left: calc(var(--mh) * -.14); z-index: 2; }
.lk .defs .cd { --h: calc(var(--mh) * .74); rotate: 6deg; box-shadow: 0 0 0 2px var(--ink), 0 4px 14px #000; }
.lk .defs .cd + .cd { margin-left: calc(var(--h) * -.36); }
.lk .defs .cd:hover { z-index: 3; rotate: 0deg; }
.lk .info { display: flex; flex-direction: column; gap: 2px; font-size: .78rem; line-height: 1.2; width: 124px; }
.lk .pw { font-size: .8rem; color: var(--muted); }
.lk .pw b { font: 800 1.2rem/1 var(--f-display); color: var(--brass); margin-right: 4px; } .lk .pw u { text-decoration: none; font: 800 1.2rem/1 var(--f-display); color: #c7d0da; margin-left: 4px; }
.arrow { flex: none; width: clamp(18px, 3vw, 56px); height: 2px; background: linear-gradient(90deg, transparent, var(--ink)); margin: 0 10px; position: relative; opacity: .6; }
.arrow::after { content: ""; position: absolute; right: -1px; top: -4px; border: 5px solid transparent; border-left-color: var(--ink); }
.res-hit { color: var(--dmg); font-weight: 700; }
.res-blk { color: var(--good); font-weight: 700; }
.stackbox { width: 200px; display: flex; flex-direction: column; gap: 5px; min-height: 0; overflow-y: auto; align-self: center; max-height: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: rgb(8 10 15 / .8); }
.stackbox .lab { font: 600 .6rem/1 var(--f-display); letter-spacing: .12em; color: var(--muted); }
.layer { display: flex; gap: 6px; align-items: center; font-size: .78rem; line-height: 1.15; }
.layer .cd { --h: 50px; }
.chainempty { flex: 1; display: grid; place-items: center; color: rgb(239 229 207 / .35); font: 600 .8rem var(--f-display); letter-spacing: .2em; }

/* ---------- Barre d'action (ruban) ---------- */
.bar { justify-self: center; max-width: 100%; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; padding: 8px 14px 8px 20px; margin: 2px 0 4px; min-height: 54px; border-radius: 27px;
  background: rgb(8 10 15 / .84); border: 1px solid var(--line); backdrop-filter: blur(6px); box-shadow: 0 10px 30px #000; }
.prompt { font-size: 1rem; flex: 1 1 280px; min-width: 0; }
.prompt b { color: var(--brass); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btns .sp { flex: 1; }
.thinking { color: var(--muted); font-style: italic; }
.thinking::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 8px; border-radius: 50%; background: var(--oc); animation: ember 1s infinite; }
.order { display: flex; gap: 6px; }
.order .cd { --h: 96px; }

/* ---------- Ta main (éventail) ---------- */
.hand { display: flex; justify-content: safe center; align-items: flex-start; --ch: var(--hh); padding: 8px 0 16px; min-height: calc(var(--hh) + 24px); min-width: 0; }
.hc { flex: none; margin: 0 calc(var(--hh) * -.03); rotate: calc(var(--d) * 2.6deg); translate: 0 calc(var(--d) * var(--d) * 2.2px); transform-origin: 50% 100%; transition: rotate .2s, translate .2s; }
.hand.tight .hc { margin: 0 calc(var(--hh) * -.13); }
.hc:hover, .hc:focus-within { rotate: 0deg; translate: 0 -6px; z-index: 6; position: relative; }
.hand .cd.click:hover { transform: scale(1.1); }
.hand .cd.sel, .hand .cd.on { transform: translateY(-10px); }
.hand .empty { align-self: center; }

/* ---------- Colonne de droite ---------- */
.side { border-left: 1px solid var(--line); background: linear-gradient(#0e1219, #090b10); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.pv { padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; flex: 0 0 auto; height: 150px; overflow-y: auto; border-bottom: 1px solid var(--line); }
.imgs .pv { height: calc(min(44dvh, calc((var(--side) - 30px) / .716)) + 124px); }
.pv .pvimg { --h: min(44dvh, calc((var(--side) - 30px) / .716)); align-self: center; box-shadow: 0 14px 40px #000; }
.pv h3 { font-size: .95rem; }
.pv p { margin: 0; font-size: .84rem; line-height: 1.3; }
.pv .meta { color: var(--muted); font-size: .76rem; }
.pv .hint { color: var(--muted); font-size: .84rem; }
.log { padding: 12px 16px; flex: 1 1 0; min-height: 90px; overflow-y: auto; font-size: .86rem; display: flex; flex-direction: column; gap: 3px; scrollbar-width: thin; }
.log p { margin: 0; }
.log .turn { font: 600 .78rem var(--f-display); letter-spacing: .08em; color: var(--ink); margin-top: 8px; display: flex; align-items: center; gap: 8px; }
.log .turn::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.log .dmg, .log .crush, .log .warn { color: var(--dmg); }
.log .plan { background: var(--brass-soft); border-left: 2px solid var(--brass); border-radius: 0 6px 6px 0; padding: 3px 7px; }
.log .why { font-style: italic; color: var(--muted); }
.log .eval { border-left: 2px solid var(--good); padding-left: 7px; }
.log .calc, .log .pitch, .log .sys { color: var(--muted); }
.log .calc { font-family: var(--f-num); font-size: .74rem; }
.log .win { font: 800 1.05rem var(--f-display); color: var(--brass); }
.sidefoot { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px; border-top: 1px solid var(--line); }

/* ---------- Accueil ---------- */
.setupwrap { height: 100%; overflow-y: auto; padding-block: 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  background: radial-gradient(900px 380px at 50% -6%, rgb(201 72 60 / .2), transparent 70%), var(--bg); }
.setupin { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.intro { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.intro h1 { font-size: clamp(1.6rem, 3.2vw, 2.6rem); letter-spacing: .08em; text-shadow: 0 0 30px rgb(255 224 138 / .25); }
.intro p { margin: 0; color: var(--muted); max-width: 86ch; }
.setup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { --c: var(--mc); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 9px; min-width: 0;
  background: linear-gradient(color-mix(in srgb, var(--c) 20%, transparent), rgb(6 8 12 / .6) 220px), var(--mat); }
.panel h2 { font-size: 1.15rem; letter-spacing: .05em; }
.panel h3 { font-size: .95rem; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
.tile { position: relative; aspect-ratio: 1.295; border-radius: 9px; border: 1px solid var(--line); overflow: hidden; padding: 0; cursor: pointer; background-color: #111; filter: saturate(.5) brightness(.6); transition: filter .2s, transform .2s, box-shadow .2s; }
.tile:hover { filter: none; transform: translateY(-3px); }
.tile:disabled { cursor: not-allowed; filter: grayscale(1) brightness(.35); transform: none; }
.tile span { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 4px 5px; background: linear-gradient(transparent, rgb(0 0 0 / .92)); font: 800 .74rem/1.1 var(--f-display); text-align: center; }
.tile span small { display: block; font: 600 .68rem var(--f-body); color: #cfc8b8; }
.tile.on { filter: none; border: 2px solid var(--c); box-shadow: 0 0 0 1px #000, 0 0 26px color-mix(in srgb, var(--c) 70%, transparent); }
.tile.rnd { background: repeating-linear-gradient(45deg, #151923 0 8px, #1b202c 8px 16px); }

<script>
/* ==========================================================
   Moteur Flesh and Blood — Silver Age — bot d'entraînement (V3)
   Moteur commun : fiches de cartes, héros, équipements, armes, jetons, alliés.
   Textes de cartes : base the-fab-cube (card.json, branche develop).
   Règles : Comprehensive Rules (ch. 1, 4, 5, 7, 8) ; clash : notes de sortie Heavy Hitters ;
   suspense : notes de sortie Super Slam.
   Decks codés : Bravo Grindstone (étape 1), Dorinthea Decimator (étape 2), Ira Edge (étape 3), Dromai (étape 5).
   Phantasm, Ward, Quell, Spectra, Opt, Transform, Mark : CR 8 (rules.fabtcg.com) ; PV des alliés remis à la base en fin de tour (CR 4.4.3a).
   ========================================================== */
(function (root) {
'use strict';

/* ---------- Utilitaires ---------- */
const PITCH = { R: 1, Y: 2, B: 3 };
const COLFR = { R: 'rouge', Y: 'jaune', B: 'bleue' };
function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
let UID = 1;
function sum(a, f) { let s = 0; for (const x of a) s += f ? f(x) : x; return s; }
function shuffle(a, rnd) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function shufDeck(G, p) { p.shufN = (p.shufN || 0) + 1; return shuffle(p.deck, G.rnd); } // mélange visible : positions connues perdues (connaissance.js)
function cname(c) { return c.col ? `${c.n} (${COLFR[c.col]})` : c.n; }
class GameOver extends Error { constructor(w) { super('over'); this.winner = w; } }
class Cancel extends Error { constructor() { super('cancel'); } }

/* =====================================================
   FICHES DE CARTES
   Une fiche = données (coût, puissance, défense, type, classe…) + crochets :
   powStatic(G, L)        bonus de puissance statique pendant l'attaque
   goStatic(G, L)         go again statique (réévalué en étape de résolution, CR 8.3.5b)
   onAttack(G, L)         déclencheurs « quand elle attaque »
   onHit(G, L)            déclencheurs « quand elle touche un héros »
   onHitAny(G, L)         déclencheurs « quand elle touche » (héros ou allié, CR 7.5.5)
   onPlay(G, p, L)        déclencheurs « quand elle est jouée »
   onLinkResolve(G, L)    déclencheurs « quand ce maillon se résout » (CR 7.6.2)
   ambush                 peut défendre depuis l'arsenal (CR 8.3.28)
   ephemeral              retirée de la partie au lieu d'aller au cimetière (CR 8.3.21)
   crush                  clé de la table CRUSH (effet quand elle inflige 4+ à un héros)
   onDefend(G, d, L, o)   déclencheurs « quand elle défend »
   defStatic(G, d, L)     bonus de défense statique
   onClashWin(G, p)       « quand tu gagnes un clash en révélant cette carte »
   resolve(G, p, ly, ctx) résolution d'un instant / réaction / action non-attaque
   react(G, p, L)         modes jouables d'une attack reaction sur ce maillon
   quiet / relevant()     instant sans cible : la page n'arrête pas le joueur pour lui
   ===================================================== */
const C = {};
function def(n, col, o) {
  const key = col ? n + '|' + col : n;
  C[key] = Object.assign({ n, col: col || '', key, img: slug(key), p: col ? PITCH[col] : 0, cost: 0, pow: null, def: null, t: 'AA', cls: 'Generic', sub: [], go: false }, o);
  return C[key];
}
// Plusieurs couleurs d'une même carte : [coût, puissance, défense] par couleur
function defCols(n, cols, base) { for (const [col, o] of Object.entries(cols)) def(n, col, Object.assign({}, base, o)); }

/* ---------- Crush (CR 8.4.2) : effets et valeur pour le bot ---------- */
// pen(G, victime, attaquant) : ce que coûte l'effet à la victime (en « points de value »)
const CRUSH = {
  boulder: {
    fr: "le héros adverse remet une carte de sa main sur le dessus de son deck",
    pen: (G, o) => o.hand.length ? 2.6 : 0,
    async fx(G, L, o) {
      if (!o.hand.length) return;
      const c = await G.agents[o.idx].pickCard(G, o, o.hand, 'topdeck', 'Boulder Drop : choisis une carte de ta main à remettre sur le dessus de ton deck');
      o.hand.splice(o.hand.indexOf(c), 1); o.deck.unshift(c);
      G.log(`${o.name} remet une carte de sa main sur le dessus de son deck (Boulder Drop).`, 'warn');
    },
  },
  buckling: {
    fr: "un compteur −1 défense sur un équipement adverse ciblé",
    pen: (G, o) => Object.values(o.eq).some(e => !e.dead && eqDef(G, o, e) > 0) ? 1.0 : 0,
    async fx(G, L, o, p) {
      const eqs = Object.values(o.eq).filter(e => !e.dead);
      if (!eqs.length) return;
      const ch = await G.agents[p.idx].choose(G, p, 'buckling', eqs.map(e => ({ label: e.n, v: e })), 'Buckling Blow : quel équipement adverse reçoit un compteur −1 défense ?');
      ch.v.cnt++; G.log(`${ch.v.n} reçoit un compteur −1 défense (Buckling Blow).`, 'warn');
    },
  },
  chokeslam: {
    fr: "ses attaques action ne peuvent pas gagner de puissance pendant sa prochaine phase d'action",
    pen: () => 1.3,
    async fx(G, L, o) { o.pend.chokeslam = true; G.log(`Les attaques action de ${o.name} ne pourront pas gagner de puissance pendant sa prochaine phase d'action (Chokeslam).`, 'warn'); },
  },
  debilitate: {
    fr: "sa première attaque de son prochain tour a −2 puissance",
    pen: () => 1.7,
    async fx(G, L, o) { o.pend.debilitate = (o.pend.debilitate || 0) + 1; G.log(`La première attaque de ${o.name} à son prochain tour aura −2 (Debilitate).`, 'warn'); },
  },
  disable: {
    fr: "une carte de son arsenal va sous son deck",
    pen: (G, o) => o.ars ? 3.2 : 0.1,
    async fx(G, L, o) {
      if (!o.ars) { G.log(`Disable : l'arsenal de ${o.name} est vide.`); return; }
      G.log(`L'arsenal de ${o.name} (${o.arsUp ? cname(o.ars) : 'carte face cachée'}) va sous son deck (Disable).`, 'warn');
      o.deck.push(o.ars); o.ars = null; o.arsUp = false;
    },
  },
  fault: {
    fr: "toutes les cartes de tous les arsenaux vont sous le deck de leur propriétaire",
    pen: (G, o, p) => (o.ars ? 3.0 : 0.1) - (p && p.ars ? 2.6 : 0),
    async fx(G) {
      for (const pl of G.players) if (pl.ars) { G.log(`L'arsenal de ${pl.name} (${pl.arsUp ? cname(pl.ars) : 'carte face cachée'}) va sous son deck (Fault Line).`, 'warn'); pl.deck.push(pl.ars); pl.ars = null; pl.arsUp = false; }
    },
  },
  flatten: {
    fr: "détruit un jeton Seismic Surge qu'il contrôle",
    pen: (G, o) => tokCount(o, 'surge') ? 1.0 : 0,
    async fx(G, L, o) { if (removeTok(o, 'surge')) G.log(`Flatten the Field détruit un Seismic Surge de ${o.name}.`, 'warn'); else G.log(`Flatten the Field : ${o.name} ne contrôle aucun Seismic Surge.`); },
  },
  confidence: {
    fr: "le héros adverse perd toutes ses capacités jusqu'à la fin de son prochain tour",
    pen: (G, o) => o.hero.ability ? 1.8 : 0.4,
    async fx(G, L, o) { o.noAbil = Math.max(o.noAbil, 1); G.log(`${o.name} perd toutes les capacités de son héros jusqu'à la fin de son prochain tour (Crush Confidence).`, 'warn'); },
  },
};
function crushText(k) { return 'Crush : ' + CRUSH[k].fr + '.'; }

/* ---------- Clash (notes Heavy Hitters) ----------
   Chaque héros révèle la carte du dessus de son deck ; la plus grande puissance gagne ;
   égalité ou aucune puissance des deux côtés : personne ne gagne. Les cartes restent sur les decks. */
function clash(G, a, b) {
  const ta = a.deck[0], tb = b.deck[0];
  const pa = ta && ta.pow !== null && ta.pow !== undefined ? ta.pow : -1;
  const pb = tb && tb.pow !== null && tb.pow !== undefined ? tb.pow : -1;
  G.log(`Clash : ${a.name} révèle ${ta ? cname(ta) : 'rien (deck vide)'}, ${b.name} révèle ${tb ? cname(tb) : 'rien (deck vide)'}. Les cartes restent sur les decks.`, 'info');
  let w = null;
  if (pa > pb && pa >= 0) w = a; else if (pb > pa && pb >= 0) w = b;
  if (w) {
    G.log(`${w.name} gagne le clash.`, 'buff');
    const rc = w === a ? ta : tb;
    if (rc && rc.onClashWin) addTrig(G, w, rc.n + ' (clash gagné)', async () => rc.onClashWin(G, w));
  } else G.log('Personne ne gagne le clash.');
  return w;
}
function clashDefend(G, o, L, tok, why) {
  addTrig(G, o, why, async () => {
    const w = clash(G, o, L.owner);
    if (w) { addTok(G, w, tok, 1); }
  });
}

/* =====================================================
   BIBLIOTHÈQUE D'EFFETS PARAMÉTRÉS (étape C, 3 nov. 2026) — pour coder vite les cartes d'un nouveau deck.
   Chaque fabrique renvoie des crochets à fusionner dans la fiche avec Object.assign :
     def('X', 'R', Object.assign({ t: 'A', cost: 0, def: 3, go: true, fr: '…' }, fxProchaineAttaque({ v: 3, cible: 'arme' }), WA));
   Valeur différente par couleur : la mettre dans la couleur (v) et ne pas la passer à la fabrique (elle prend this.v) :
     defCols('X', { R: { v: 3 }, Y: { v: 2 }, B: { v: 1 } }, Object.assign({ t: 'A', cost: 0, def: 3, go: true, fr: '…' }, fxProchaineAttaque({ cible: 'arme' }), WA));
   Fabriques :
     fxProchaineAttaque({ v, cible, go })   action : « ta prochaine attaque (cible) ce tour gagne +v (et go again) »
     fxEffets([effets])                     action ou instant : applique les effets à la résolution
     fxQuandTouche([effets], { allie })     attaque : « quand elle touche un héros » (allie: true → « quand elle touche », héros ou allié)
     fxQuandAttaque([effets])               attaque : « quand elle attaque »
     fxQuandJouee([effets])                 attaque : « quand tu la joues »
   Effets élémentaires : { pioche: n } · { jeton: 'might' | 'vigor' | 'quicken' | 'ponder' | … , n } · { pv: n } ·
     { defausse: n } (le héros adverse défausse n cartes, à son choix) · { prochaine: v, cible, go } · { fn: async (G, p, o, L) => … } (effet propre, avec val: estimation pour le bot).
   Cibles : 'toute' (défaut), 'arme', 'hache', 'action' (attaque action), ou une fonction L => booléen.
   Bot : fxProchaineAttaque renseigne plan(S) (bonus compté pour 'toute', 'arme', 'hache') ; fxEffets donne plan(S) = valeur estimée ;
   fxQuandTouche pose hitVal, fxQuandAttaque / fxQuandJouee posent atkVal (lus par simAttack). Estimations grossières (fxValeur) :
   à régler ensuite par reglage/ si besoin. Tests : tests/effets.test.js.
   ===================================================== */
const FX_CIBLE = {
  toute: { cond: null, label: 'prochaine attaque', S: 'nextAny' },
  arme: { cond: L => !!L.isWeapon, label: 'prochaine attaque d’arme', S: 'nextW' },   // libellé lu par planState (nextW)
  hache: { cond: L => !!(L.isWeapon && L.weapon && L.weapon.axe), label: 'prochaine attaque de hache', S: 'nextAxe' },
  action: { cond: L => !!L.isAA, label: 'prochaine attaque action', S: null },
};
function fxCible(c) {
  if (typeof c === 'function') return { cond: c, label: 'prochaine attaque (sous condition)', S: null };
  const r = FX_CIBLE[c || 'toute']; if (!r) throw new Error('fx : cible inconnue ' + c); return r;
}
function fxPush(G, p, v, cible, why, go) {
  const ci = fxCible(cible), m = { v, why, label: ci.label };
  if (ci.cond) m.cond = ci.cond;
  if (go) m.go = true;
  p.nextAtk.push(m);
  G.log(`${p.name} : sa ${ci.label} ce tour aura ${[v ? '+' + v : '', go ? 'go again' : ''].filter(Boolean).join(' et ')} (${why}).`, 'buff');
}
function fxValeur(effets) {
  let v = 0;
  for (const e of effets) v += (e.pioche || 0) * 1.0 + (e.jeton ? 0.6 * (e.n || 1) : 0) + (e.pv || 0) * 0.5 + (e.defausse || 0) * 1.4
    + (e.prochaine || 0) * 0.8 + (e.go ? 0.5 : 0) + (e.val || 0);
  return v;
}
async function fxRun(G, p, effets, why, L) {
  const o = G.opp(p);
  for (const e of effets) {
    if (e.pioche) { draw(G, p, e.pioche); G.log(`${p.name} pioche ${e.pioche > 1 ? e.pioche + ' cartes' : 'une carte'} (${why}).`, 'buff'); }
    if (e.jeton) { if (!TOKEN[e.jeton]) throw new Error('fx : jeton inconnu ' + e.jeton); addTok(G, p, e.jeton, e.n || 1); }
    if (e.pv) { p.hp += e.pv; G.log(`${p.name} gagne ${e.pv} PV (${why}). PV : ${p.hp}.`, 'buff'); }
    for (let i = 0; i < (e.defausse || 0) && o.hand.length; i++) {
      const c = await G.agents[o.idx].pickCard(G, o, o.hand, 'discard', `${why} : choisis une carte de ta main à défausser`);
      o.hand.splice(o.hand.indexOf(c), 1); toGrave(G, o, c); G.log(`${o.name} défausse ${cname(c)} (${why}).`, 'warn');
    }
    if (e.prochaine !== undefined || e.go) fxPush(G, p, e.prochaine || 0, e.cible, why, e.go);
    if (e.fn) await e.fn(G, p, o, L);
  }
}
function fxProchaineAttaque(o) {
  o = o || {}; const ci = fxCible(o.cible);
  return {
    async resolve(G, p) { fxPush(G, p, o.v !== undefined ? o.v : (this.v || 0), o.cible, this.n, o.go); },
    plan(S) { const v = o.v !== undefined ? o.v : (this.v || 0); if (ci.S) S[ci.S] += v; if (o.go && o.cible === 'arme') S.wGo += 1; return 0; },
  };
}
function fxEffets(effets) {
  return {
    async resolve(G, p, ly) { await fxRun(G, p, effets, this.n, ly && ly.L); },
    plan(S) { for (const e of effets) if (e.prochaine !== undefined) { const ci = fxCible(e.cible); if (ci.S) S[ci.S] += e.prochaine; } return fxValeur(effets.filter(e => e.prochaine === undefined)); },
  };
}
function fxQuandTouche(effets, o) {
  const hook = (G, L) => { const p = L.owner; addTrig(G, p, L.src.n, async () => fxRun(G, p, effets, L.src.n, L)); };
  return Object.assign((o && o.allie) ? { onHitAny: hook } : { onHit: (G, L) => hook(G, L) }, { hitVal: fxValeur(effets) });
}
function fxQuandAttaque(effets) {
  return { onAttack: (G, L) => { const p = L.owner; addTrig(G, p, L.src.n, async () => fxRun(G, p, effets, L.src.n, L)); }, atkVal: fxValeur(effets) };
}
function fxQuandJouee(effets) {
  return { onPlay(G, p, L) { const n = this.n; addTrig(G, p, n, async () => fxRun(G, p, effets, n, L)); }, atkVal: fxValeur(effets) };
}
/* ---------- Guardian : Bravo Grindstone ---------- */
const GU = { cls: 'Guardian' };
defCols('Boulder Drop', { R: { pow: 7 }, Y: { pow: 6 }, B: { pow: 5 } }, Object.assign({ cost: 3, def: 3, crush: 'boulder', fr: crushText('boulder') }, GU));

// Opt N (CR 8.5.22) : regarde les N cartes du dessus, en remet autant qu'on veut dessus ou dessous, dans l'ordre choisi
async function optN(G, p, N, why) {
  const cards = p.deck.slice(0, N); if (!cards.length || N <= 0) return;
  const A = G.agents[p.idx];
  let top = [], bottom = [];
  const plan = A.optPlan ? await A.optPlan(G, p, cards) : null; // la page enveloppe les méthodes du bot (promesse)
  if (plan) [top, bottom] = plan;
  else {
    for (const c of cards) {
      const r = await A.choose(G, p, 'optcard', [{ label: `Laisser ${cname(c)} sur le dessus`, v: 'top', c }, { label: `Mettre ${cname(c)} sous le deck`, v: 'bottom', c }], `${why} : opt ${N} — ${cname(c)}`);
      (r.v === 'bottom' ? bottom : top).push(c);
    }
    if (top.length > 1 && A.orderCards) top = await A.orderCards(G, p, top, `Opt : ordre des cartes remises sur le dessus de ton deck (la n°1 sera piochée en premier)`);
  }
  p.deck.splice(0, cards.length); p.deck.unshift(...top); p.deck.push(...bottom);
  if (top.length) p.knownTop = top[0].uid;
  G.log(`${p.name} regarde les ${cards.length} carte${cards.length > 1 ? 's' : ''} du dessus de son deck (opt ${N}, ${why}) : ${top.length} dessus, ${bottom.length} dessous.`, 'info');
}

  if (!ok && !p.isBot) G.log(`Kano : la carte du dessus est ${cname(t)}, ce n'est pas une action non-attaque. Elle reste sur le dessus.`, 'info');
  if (!r.v) { if (ok || p.isBot) G.log(`${p.name} regarde la carte du dessus de son deck et ne la bannit pas.`, 'info'); return; }
  p.deck.shift(); t.banPlay = { turn: G.turn, instant: true }; p.ban.push(t);

  for (const k of Object.keys(C)) { const c = C[k]; if (c.stealth || (c.t === 'AA' && c.contract)) c.keepV = 0.5 * (c.hitVal || 0) + (c.arBonus ? 0.6 : 0); }
})();

function tokCount(p, k) { return p.auras.filter(a => a.tk === k).length; }
function addTok(G, p, k, n) { for (let i = 0; i < n; i++) p.auras.push({ tk: k, uid: UID++ }); G.log(`${p.name} crée ${n > 1 ? n + ' jetons' : 'un jeton'} ${TOKEN[k].n}.`, 'buff'); G.upd(); }
function removeTok(p, k) { const i = p.auras.findIndex(a => a.tk === k); if (i < 0) return false; p.auras.splice(i, 1); return true; }

   L'attaquant choisit la cible (héros ou allié adverse) en jouant l'attaque. */
const DRAGON = { dragon: true, cls: 'Draconic Illusionist', sub: ['Dragon'] };
const ALLY = {
  azvolai: Object.assign({ n: 'Azvolai', pow: 2, life: 3, img: 'azvolai', persist: 2.6,
    fr: "Allié dragon 2/3. Chaque fois qu'Azvolai attaque, tu peux lui faire infliger 1 dégât arcane à jusqu'à 2 cibles (la page propose le héros adverse et ses alliés).",
    onAttack(G, L) { const p = L.owner; addTrig(G, p, 'Azvolai', async () => {
      const o = G.opp(p);
      const cands = [{ label: `${o.name} (héros)`, v: { hero: o } }].concat(o.allies.map(a => ({ label: `${a.n} (allié de ${o.name}, ${a.life} PV)`, v: { ally: a } })));
      const picked = [];
      for (let k = 1; k <= 2; k++) {
        const left = cands.filter(c => !picked.includes(c.v));
        if (!left.length) break;
        const r = await G.agents[p.idx].choose(G, p, 'azvolai', left.concat([{ label: k === 1 ? 'Aucune cible' : 'Pas de deuxième cible', v: null }]),
          `Azvolai attaque : ${k === 1 ? 'première' : 'deuxième'} cible d'1 dégât arcane (jusqu'à 2 cibles)`, { k });
        if (!r || !r.v) break;

// Prendre le contrôle d'un objet adverse (Kyloria : définitif ; Jack Be Nimble : jusqu'à la fin de cette phase d'action)
function stealItem(G, p, o, why, temp) {
  const it = o.items.find(x => x.item); if (!it) return false;
  o.items.splice(o.items.indexOf(it), 1); it.ownerP = it.ownerP || o; it.stolenUntil = temp ? G.turn : null; p.items.push(it);
  G.log(`${p.name} prend le contrôle de ${cname(it)} de ${o.name} (${why}${temp ? ", jusqu'à la fin de cette phase d'action" : ''}).`, 'buff');
  return true;
}
function returnStolen(G) {
  for (const pl of G.players) for (const it of pl.items.slice()) if (it.stolenUntil === G.turn && it.ownerP && it.ownerP !== pl) {
    pl.items.splice(pl.items.indexOf(it), 1); it.stolenUntil = null; it.ownerP.items.push(it);
    G.log(`${cname(it)} revient à ${it.ownerP.name} (fin de la phase d'action).`, 'info');
  }
}
function cromaiAP(G, p, a, why) {
  if (a.apTurn === G.turn) return;
  a.apTurn = G.turn;
  addTrig(G, p, 'Cromai', async () => { if (G.players[G.active] !== p) { G.log(`Cromai ${why} : point d'action gagné hors de ton tour (sans effet).`); return; } p.ap += 1; G.log(`Cromai ${why} : ${p.name} gagne 1 point d'action.`, 'buff'); });
}
function mkAlly(G, p, key, card) {
  const f = ALLY[key]; if (!f) throw new Error('Allié inconnu ' + key);
  const a = Object.assign({ uid: UID++, key, usedTurn: -1, ally: true, card: card || null }, f, { life: f.life });
  if (f.endur) a.endur = f.endur;
  p.allies.push(a); G.log(`${p.name} crée ${f.n} (allié ${f.pow}/${f.life}).`, 'buff');
  if (f.onEnter) f.onEnter(G, p, a);
  G.upd(); return a;
}
function destroyAlly(G, owner, a, why) {
  const i = owner.allies.indexOf(a); if (i < 0) return;
  owner.allies.splice(i, 1); G.log(`${a.n} est détruit${why ? ' (' + why + ')' : ''}.`, 'warn');
  if (a.card) toGrave(G, owner, a.card);
  if (a.onLeave) a.onLeave(G, owner, a);
}

// Les decks sont dans src/decks/<id>.js (DECKS.<id> = { … }), assemblés juste après ce fichier dans l’ordre de src/ordre.txt.
const DECKS = {};
// Étape E : plans de side rangés par ARCHÉTYPE adverse (comme Trehet). Chaque deck a une étiquette `archetype` ;
// ses plans sont `plans.<archétype>`. Un nouveau deck n'oblige plus à toucher aux plans des autres.
// Recherche : plans[<id du deck adverse>] (exception rare, à justifier) → plans[<archétype adverse>] → plans[defaultPlan].
// Un plan peut être une chaîne = renvoi vers le plan d'un autre archétype (ex. illusionist: 'aggro').
const ARCHETYPES = {
  aggro: 'Aggro', wizard: 'Wizard', runeblade: 'Runeblade', guardian: 'Guardian', brute: 'Brute', warrior: 'Warrior',
  illusionist: 'Illusionist', ranger: 'Ranger', mechanologist: 'Mechanologist', assassin: 'Assassin',
};
function planEntry(d, key) {
  let pl = d.plans && d.plans[key], seen = 0;
  while (typeof pl === 'string' && seen++ < 5) { key = pl; pl = d.plans[key]; }
  return pl && typeof pl === 'object' ? { pl, key } : null;
}
function deckPlan(deckId, vsId) {
  const d = DECKS[deckId], vs = DECKS[vsId], arch = vs && vs.archetype;
  let hit = planEntry(d, vsId), via = 'deck';
  if (!hit && arch) { hit = planEntry(d, arch); via = 'archetype'; }
  if (!hit) { hit = planEntry(d, d.defaultPlan); via = 'defaut'; }
  if (!hit) return { out: {}, eq: {}, arch, planKey: null, via: 'aucun' };
  return Object.assign({}, hit.pl, { arch, planKey: hit.key, via });
}
function expandPool(pool, out) {
  const keys = [], o = Object.assign({}, out || {});
  for (const [k, q] of pool) for (let i = 0; i < q; i++) { if (o[k] > 0) { o[k]--; continue; } keys.push(k); }
  return keys;
}
function defaultEq(deckId, vsId) {
  const d = DECKS[deckId], pl = deckPlan(deckId, vsId), out = {};
  for (const [s, list] of Object.entries(d.eqChoices)) out[s] = (pl.eq && pl.eq[s]) || list[0];
  return out;
}

function mk(key) { const d = C[key]; if (!d) throw new Error('Carte inconnue ' + key); return Object.assign({ uid: UID++ }, d); }

function mkPlayer(spec, rnd) {
  const hero = HERO[spec.hero];
  const p = {
    heroId: spec.hero, hero, name: spec.name || hero.short, hp: hero.hp, intellect: hero.int, deckId: spec.deckId,
    deck: shuffle(spec.cards.map(mk), rnd), hand: [], ars: null, arsUp: false, pitch: [], grave: [], ban: [],
    eq: {}, weapons: [], auras: [], susp: [], allies: [], res: 0, ap: 0, heroTapped: false,
    atk: 0, nextAtk: [], nextGuardAA: [], firstActionDone: false, deb: {}, pend: {}, noAbil: 0, surgeDiscount: 0, arcaneTurn: -1,
    marked: false, dorTurn: -1, wAtkTurn: -1, hasReprise: spec.cards.some(k => C[k] && C[k].repriseKw),
    shields: [], items: [], knownTop: -1, arcTurn: -1, arcNext: [], amp: 0, stir: null, mmb: false, nextTiger: 0, tigerAtkTurn: -1, redTurn: -1, redN: 0, illuAtk: 0, dragonAtk: 0,
    bluePitchTurn: -1, spiderTurn: -1, // Nuu : bleue pitchée ce tour (Hiss, Venomous Bite) ; Spider's Bite
    stats: { dealt: 0, prevented: 0, turns: 0, blockCards: 0, blockEq: 0, presented: 0 },
  };
  for (const n of spec.eq) { if (!EQ[n] && WEAP[n]) { spec = Object.assign({}, spec, { weapons: spec.weapons.concat([n]) }); continue; } } // 2e arme 1 main choisie dans l'emplacement off-hand (Nuu)
  for (const n of spec.eq.filter(x => EQ[x])) { const e = EQ[n]; if (!e) throw new Error('Équipement inconnu ' + n); p.eq[e.slot] = { n, slot: e.slot, def: e.def, cnt: 0, kw: e.kw, dead: false, used: false, img: slug(n), uid: UID++ }; }
  for (const n of spec.weapons) { const w = WEAP[n]; if (!w) throw new Error('Arme inconnue ' + n); p.weapons.push(Object.assign({ n, usedTurn: -1, wid: UID++, img: slug(n), cnt: 0 }, w)); }
  return p;
}

function Game(opts) {
  const rnd = opts.rnd || Math.random;
  const G = {
    rnd, turn: 0, active: 0, chain: [], chainOpen: false, firstTurnDone: false, over: false, winner: null,
    stack: [], trig: [], step: null, prio: null,
    logs: [], pause: opts.pause || (async () => {}), onLog: opts.onLog || (() => {}), onUpdate: opts.onUpdate || (() => {}),
  };
  G.players = opts.players.map(s => mkPlayer(s, rnd));
  G.players.forEach((p, i) => { p.idx = i; p.isBot = !!opts.players[i].isBot; });
  G.agents = opts.agents;
  G.opp = p => G.players[1 - p.idx];
  G.log = (t, cls) => { G.logs.push({ t, cls: cls || '', turn: G.turn }); G.onLog(t, cls || ''); };
  G.upd = () => G.onUpdate(G);
  return G;
}

function draw(G, p, n) { for (let i = 0; i < n; i++) { if (!p.deck.length) { G.log(`${p.name} ne peut plus piocher : son deck est vide (CR 8.5.6b).`, 'warn'); return; } p.hand.push(p.deck.shift()); } }
function drawUp(G, p) { const n = p.intellect - p.hand.length; if (n > 0) draw(G, p, n); }
function toGrave(G, p, c) {
  if (c.ownerP) p = c.ownerP; // carte d'un autre joueur (objet volé, carte adverse jouée par Nuu) : cimetière de son propriétaire
  if (c.token) return;
  if (c.ephemeral) { G.log(`${cname(c)} est retiré de la partie (éphémère).`); return; } // CR 8.3.21
  p.grave.push(c); if (c.onGrave) c.onGrave(G, p);
}
/* ---------- Bannir (Nuu) ----------
   Les cartes bannies vont face visible dans la zone de bannissement de leur propriétaire.
   by : joueur qui bannit ; L : maillon dont la carte bannit (« whenever this banishes ») ; contrats des cartes de by sur la chaîne. */
function banishCards(G, by, owner, cards, why, L) {
  cards = cards.filter(Boolean); if (!cards.length) return [];
  for (const c of cards) owner.ban.push(c);
  G.log(`${why} : ${cards.map(cname).join(', ')} ${cards.length > 1 ? 'sont bannies' : 'est bannie'} (zone de bannissement de ${owner.name}).`, 'warn');
  for (const c of cards) {
    if (L) { L.banished = L.banished || []; const prev = L.banished.slice(); L.banished.push(c); if (L.src.onBanish) L.src.onBanish(G, L, c, prev, owner); }
    if (owner !== by) for (const ln of G.chain) if (ln.owner === by && ln.src.contract && ln.src.contract.cond(c)) {
      by.contracts = (by.contracts || 0) + 1;
      addTrig(G, by, `${ln.src.n} (contrat rempli)`, async () => ln.src.contract.reward(G, by, ln, c));
    }
  }
  return cards;
}
function banishTop(G, by, owner, n, why, L) { return banishCards(G, by, owner, owner.deck.splice(0, n), why, L); }
function createInHand(G, p, key, why) { const c = mk(key); p.hand.push(c); G.log(`${p.name} crée ${cname(c)} dans sa main${why ? ' (' + why + ')' : ''}.`, 'buff'); G.upd(); return c; }
function eqDef(G, p, e, L) {
  if (!e || e.dead) return 0;
  let d = (e.halved === G.turn ? Math.ceil(e.def / 2) : e.def) - e.cnt; // Decimator Great Axe, jusqu'à la fin du tour
  const f = EQ[e.n];
  if (f.defStatic) d += f.defStatic(G, p, e, L);
  if (e.tmp && e.tmp.turn === G.turn) d += e.tmp.v; // « jusqu'à la fin du tour » (Unity)
  return Math.max(0, d);
}
// Une arme « une fois par tour » peut attaquer une fois de plus ce tour si un effet le permet (Dorinthea)
function weaponUsesLeft(G, w) {
  if (w.noAtk) return 0;
  if (!w.once) return 9;
  const used = w.usesTurn === G.turn ? w.uses : 0;
  const allowed = 1 + (w.extraTurn === G.turn ? (w.extraN || 1) : 0);
  return Math.max(0, allowed - used);
}
function heroAbilityOK(G, p) { return !!(p.hero.ability && p.noAbil <= 0 && !(p.hero.ability.tap && p.heroTapped)); }

async function dealDamage(G, target, n, o) {
  o = o || {};
  if (n <= 0) return 0;
  if (!o.noPrevent) { // Pick to Pieces : dégâts qui ne peuvent pas être empêchés
  // Prévention « les N prochains dégâts de cette source ce tour » (Oasis Respite)
  for (const s of target.shields) {
    if (s.turn !== G.turn || s.left <= 0 || n <= 0) continue;
    const match = s.src === 'any' || (s.src === 'red' && o.src && o.src.col === 'R') || (o.src && s.src === o.src);
    if (!match) continue;
    const k = Math.min(s.left, n); s.left -= k; n -= k; if (s.once) s.left = 0;
    target.stats.prevented += k;
    G.log(`${s.why} empêche ${k} dégât${k > 1 ? 's' : ''}.`, 'def');
  }
  if (n <= 0) return 0;
  n = applyWards(G, target, n);
  if (n <= 0) return 0;
  // Quell N (CR 8.3.19) : payer N pour empêcher N ; l'équipement est détruit au début de la phase de fin
  for (const e of Object.values(target.eq)) {
    const q = EQ[e.n].quell;
    if (!q || e.dead || e.quellTurn === G.turn || n <= 0 || !canAfford(target, q, -1)) continue;
    const r = await G.agents[target.idx].choose(G, target, 'quell', [{ label: `Payer ${q} (empêche ${q})`, v: true, n }, { label: 'Non', v: false, n }], `Quell : tu vas subir ${n} dégât${n > 1 ? 's' : ''}. Payer ${q} pour en empêcher ${q} (${e.n} sera détruit en fin de tour) ?`);
    if (!r.v) continue;
    await pay(G, target, q, -1, 'Quell'); n -= q; e.quellTurn = G.turn; target.stats.prevented += q;
    G.log(`${target.name} paie ${q} (Quell, ${e.n}) et empêche ${q} dégât${q > 1 ? 's' : ''}.`, 'def');
  }
  if (n <= 0) return 0;
  if (o.arcane) {
    // Pyroglyphic Protection : « si tu dois subir des dégâts arcane, empêche-en N »
    for (const s of target.susp) if (s.card.arcPrevent && n > 0) {
      const k = Math.min(s.card.arcPrevent, n); n -= k; target.stats.prevented += k;
      G.log(`${s.card.n} empêche ${k} dégât${k > 1 ? 's' : ''} arcane.`, 'def');
    }
    if (n <= 0) return 0;
    // Spellvoid X (CR 8.3.15) : X = nombre de maillons contrôlés (Mask of the Swarming Claw)
    const sv = Object.values(target.eq).find(e => !e.dead && EQ[e.n].spellvoid);
    const X = sv ? Math.min(n, chainLinksControlled(G, target)) : 0;
    if (X > 0) {
      const r = await G.agents[target.idx].choose(G, target, 'spellvoid', [{ label: `Détruire ${sv.n} (empêche ${X})`, v: X }, { label: 'Non', v: 0 }], `Spellvoid : détruire ${sv.n} pour empêcher ${X} des ${n} dégâts arcane ?`);
      if (r.v > 0) { sv.dead = true; n -= r.v; G.log(`${target.name} détruit ${sv.n} (Spellvoid) et empêche ${r.v} dégât(s) arcane.`, 'def'); }
      if (n <= 0) return 0;
    }
    // Arcane Barrier (CR 8.3.8)
    const opts = barrierOpts(target, n);
    if (opts.length > 1) {
      const r = await G.agents[target.idx].choose(G, target, 'barrier', opts, `Arcane Barrier : tu vas subir ${n} dégâts arcane. Payer pour en empêcher ?`);
      if (r.v > 0) { await pay(G, target, r.v, -1, 'Arcane Barrier'); n -= r.prev; target.stats.prevented += r.prev; G.log(`${target.name} paie ${r.v} (Arcane Barrier) et empêche ${r.prev} dégât${r.prev > 1 ? 's' : ''} arcane.`, 'def'); }
    }
    if (n <= 0) return 0;
    target.arcaneTurn = G.turn;
  }
  }
  target.hp -= n;
  G.opp(target).stats.dealt += n;
  G.log(`${target.name} subit ${n} dégât${n > 1 ? 's' : ''}${o.why ? ' (' + o.why + ')' : ''}. PV : ${Math.max(0, target.hp)}.`, 'dmg');
  if (target.hp <= 0) throw new GameOver(G.opp(target));
  return n;
}
// Sources « Arcane Barrier N » qui protègent le héros d'un joueur : ses équipements ET ses alliés (Aether Ashwing) — CR 8.3.8 (corrigé le 30 oct. 2026)
function barrierSources(p) {
  return Object.values(p.eq).filter(e => !e.dead && EQ[e.n].barrier).map(e => EQ[e.n].barrier)
    .concat((p.allies || []).filter(a => ALLY[a.key] && ALLY[a.key].barrier).map(a => ALLY[a.key].barrier));
}
// Options d'Arcane Barrier : chaque source « Arcane Barrier N » se paie N pour empêcher N (CR 8.3.8)
function barrierOpts(p, n) {
  const src = barrierSources(p);
  const avail = p.res + sum(p.hand, c => c.p), best = {};
  for (let m = 1; m < (1 << src.length); m++) {
    let payN = 0; for (let i = 0; i < src.length; i++) if (m & (1 << i)) payN += src[i];
    const prev = Math.min(payN, n);
    if (payN > avail) continue;
    if (best[prev] === undefined || payN < best[prev]) best[prev] = payN;
  }
  const opts = Object.keys(best).map(Number).sort((a, b) => b - a).map(k => ({ label: `Payer ${best[k]} (empêche ${k})`, v: best[k], prev: k, n }));
  opts.push({ label: 'Ne rien payer', v: 0, prev: 0, n });
  return opts;
}
function damageAlly(G, owner, a, n) {
  if (a.endur > 0 && n > 0) { a.endur--; const k = Math.min(3, n); n -= k; G.log(`${a.n} retire son compteur endurance et empêche ${k} dégât${k > 1 ? 's' : ''}.`, 'def'); }
  if (n <= 0) return 0;
  a.life -= n;
  G.log(`${a.n} (allié de ${owner.name}) subit ${n} dégât${n > 1 ? 's' : ''}. PV : ${Math.max(0, a.life)}.`, 'dmg');
  if (a.life <= 0) destroyAlly(G, owner, a);
  return n;
}
// Équipement détruit (Ward, coût « détruis-le ») : déclencheurs « quand il est détruit »
function destroyEq(G, p, e, why) {
  if (e.dead) return; e.dead = true;
  for (const L of G.chain) { const i = L.defenders.findIndex(d => d.eq === e); if (i >= 0) L.defenders.splice(i, 1); }
  if (why) G.log(`${e.n} est détruit (${why}).`, 'def');
  const f = EQ[e.n];
  if (f.onDestroy) addTrig(G, p, e.n, async () => addTok(G, p, f.onDestroy, 1));
}
// Ward (CR 8.3.20) : chaque source de ward s'applique tant qu'il reste des dégâts (ordre choisi par la page :
// Silken Shroud, Spectral Shield, Wave of Reality, Essence of Ancestry)
function wardSources(p) {
  const out = [];
  const eqW = n => Object.values(p.eq).filter(e => !e.dead && EQ[e.n].ward && e.n === n).map(e => ({ kind: 'eq', e, n: EQ[e.n].ward, label: e.n }));
  out.push(...eqW('Silken Shroud'));
  for (const a of p.auras.filter(x => x.tk === 'spectral')) out.push({ kind: 'tok', a, n: 1, label: 'Spectral Shield' });
  out.push(...eqW('Wave of Reality'));
  for (const s of p.susp.filter(x => x.card.ward)) out.push({ kind: 'aura', s, n: s.card.ward, label: s.card.n });
  return out;
}
function wardTotal(p) { return sum(wardSources(p), w => w.n); }
function applyWards(G, p, n) {
  for (const w of wardSources(p)) {
    if (n <= 0) break;
    const k = Math.min(w.n, n); n -= k;
    G.log(`Ward : ${w.label} est détruit et empêche ${k} dégât${k > 1 ? 's' : ''}.`, 'def');
    p.stats.prevented += k;
    if (w.kind === 'eq') destroyEq(G, p, w.e);
    else if (w.kind === 'tok') p.auras.splice(p.auras.indexOf(w.a), 1);
    else { p.susp.splice(p.susp.indexOf(w.s), 1); toGrave(G, p, w.s.card); auraLeaves(G, p, w.s.card); }
  }
  return n;
}
function illuAuras(p) { return p.susp.some(s => isIllu(s.card)) || tokCount(p, 'spectral') > 0; }
function auraLeaves(G, p, c) {
  if (c.n !== 'Essence of Ancestry: Body') return;
  addTrig(G, p, c.n, async () => {
    if (illuAuras(p)) { G.log(`${c.n} : ${p.name} contrôle encore une aura Illusionist, pas d'effet.`); return; }
    p.shields.push({ left: 999, src: 'red', turn: G.turn, why: c.n, once: true });
    G.log(`${c.n} : la prochaine fois que ${p.name} doit subir des dégâts d'une source rouge ce tour, ils sont empêchés.`, 'def');
  });
}

/* ---------- Coûts & paiement ---------- */
function canAfford(p, cost, excludeUid) { return p.res + sum(p.hand.filter(c => c.uid !== excludeUid), c => c.p) >= cost; }
async function pay(G, p, cost, excludeUid, label) {
  if (cost <= p.res) { p.res -= cost; p.chi = Math.max(0, (p.chi || 0) - cost); G.upd(); return true; } // CR 1.14.2d : le chi part en premier
  const need = cost - p.res;
  const picks = await G.agents[p.idx].payPitch(G, p, need, excludeUid, label);
  let got = 0;
  for (const c of picks) {
    if (got >= need) break;
    const i = p.hand.indexOf(c); if (i < 0 || c.uid === excludeUid) continue;
    got += c.p; p.hand.splice(i, 1); p.pitch.push(c); p.res += c.p;
    G.log(`${p.name} pitche ${cname(c)} (+${c.p}).`, 'pitch');
    if (c.col === 'B') p.bluePitchTurn = G.turn; // « si tu as pitché une carte bleue ce tour » (Nuu)
    if (c.chi) p.chi = (p.chi || 0) + c.p; // Inner Chi : points de chi (CR 1.13.5a), utilisables comme ressources (1.13.5b)
    if (c.col === 'R' && p.hero.ashPitch && p.noAbil <= 0) addTrig(G, p, 'Dromai', async () => addTok(G, p, 'ash', 1));
  }
  if (p.res < cost) throw new Error('Paiement insuffisant');
  p.res -= cost; p.chi = Math.max(0, (p.chi || 0) - cost); G.upd(); return true;

/* ---------- Tour ---------- */
async function runGame(G) {

    const w = G.players[coin];

    G.active = goFirst ? coin : 1 - coin;

      G.turn++;
      await takeTurn(G, G.players[G.active]);

      G.active = 1 - G.active;
      if (G.turn > 600) { G.log('Partie arrêtée (sécurité : 600 tours).', 'sys'); G.over = true; return null; }
    }
  } catch (e) {
    if (e instanceof GameOver) {
      G.over = true; G.winner = e.winner; G.stack = []; G.prio = null;
      G.log(`${e.winner.name} remporte la partie !`, 'win'); G.upd();
      return e.winner;
    }

  }
}

    p.deck.push(...p.hand.map(faceAvant)); p.hand = []; if (p.ars) { p.deck.push(faceAvant(p.ars)); p.ars = null; p.arsUp = false; }
    G.log(`Le jeton Inertia de ${p.name} est détruit : ${n} carte${n > 1 ? 's' : ''} de sa main et de son arsenal vont sous son deck.`, 'warn');
  });
  for (const pl of G.players) for (const e of Object.values(pl.eq)) if (e.quellTurn === G.turn && !e.dead) addTrig(G, pl, e.n, async () => destroyEq(G, pl, e, 'Quell'));

  for (const hv of p.hand.filter(c => c.heave)) addTrig(G, p, 'Heave : ' + hv.n, async () => {

    if (p.res + sum(p.hand.filter(c => c !== hv), c => c.p) < hv.heave) return;
    const yes = await G.agents[p.idx].heave(G, p, hv);
    if (!yes) return;
    let paid = false;
    try { await pay(G, p, hv.heave, hv.uid, 'Heave'); paid = true; } catch (e) { if (!(e instanceof Cancel)) throw e; }
    if (paid) {
      p.hand.splice(p.hand.indexOf(hv), 1); p.ars = hv; p.arsUp = true;

  // 2. Arsenal (CR 4.4.3b)

  if (p.noAbil > 0) p.noAbil--;

  if (!G.firstTurnDone) { G.firstTurnDone = true; for (const pl of G.players) drawUp(G, pl); }
  else drawUp(G, p);
  G.step = null;
  G.upd();
}

/* ---------- Jouer cartes et capacités ---------- */
function removeFrom(p, c, from) {

  else if (from === 'ban') { const i = p.ban.indexOf(c); if (i >= 0) p.ban.splice(i, 1); }

}
// hitFx : « quand elle touche un héros » ; hitAnyFx : « quand elle touche » (héros ou allié)
function newLink(p, o) { return Object.assign({ owner: p, mods: [], go: false, dominate: false, defenders: [], hitFx: [], hitAnyFx: [], isAA: true, isWeapon: false, target: null }, o); }

async function perform(G, p, act, ctx) {

    if (act.cost) await pay(G, p, act.cost, -1, cname(it));

async function chooseTarget(G, p) {
  const o = G.opp(p);

  if (!o.allies.length && !spectra.length) return { hero: o };
  const opts = [{ label: `${o.name} (héros)`, v: { hero: o } }].concat(o.allies.map(a => ({ label: `${a.n} (allié, ${a.life} PV)`, v: { ally: a } })),

function quickenOnPlay(G, p, L) {

async function playAttackCard(G, p, c, from) {

  G.log(`${p.name} joue ${cname(c)}${from === 'ars' ? ' depuis son arsenal' : from === 'ban' ? ' depuis sa zone de bannissement' : from === 'oban' ? ` depuis la zone de bannissement de ${c.ownerP.name} (Nuu)` : ''}.`, 'act');

async function activateWeapon(G, p, w) {

  G.log(`${p.name} active ${w.n}.`, 'act');

async function attackWithAlly(G, p, a) {

async function activateHero(G, p, ctx) {

async function playNonAttack(G, p, c, from, ctx, inst) {

  const ly = { kind: 'card', owner: p, card: c, label: cname(c), L: ctx.L, goAgain: c.t === 'A' && !!c.go, fused, X };
  if (c.t === 'A') { // Kano : bonus arcane attachés à la carte jouée, Stir, Mage Master Boots
    arcT(G, p);
    if (c.arc || c.arcDyn) { ly.arcBonus = sum(p.arcNext, m => m.v); ly.arcWhy = p.arcNext.map(m => m.why); p.arcNext = []; }
    if (isWizNAA(c) && p.stir) { if (c.arc || c.arcDyn) { ly.arcBonus += p.stir.v; ly.arcWhy.push('Stir the Aetherwinds'); } p.stir = null; }
    if (p.mmb) { p.mmb = false; if (!ly.goAgain) { ly.goAgain = true; G.log(`${cname(c)} gagne go again (Mage Master Boots).`, 'buff'); } }
  }
  ly.run = async () => {
    if (c.item) { p.items.push(c); G.log(`${cname(c)} entre dans l'arène (objet).`); return; }
    if (c.aura) { p.susp.push({ card: c, counters: 0, aura: true }); G.log(`${cname(c)} entre dans l'arène (aura).`); return; }
    if (c.invoke) { // l'invocation devient l'allié, l'Ash passe dessous (CR 8.5.36)

      if (c.susp) { p.susp.push({ card: c, counters: 2 }); G.log(`${cname(c)} entre en jeu avec 2 compteurs suspense.`); }
      else p.susp.push({ card: c, counters: 0, aura: true });

    if (c.transcend && transcendOK(G, p, c)) { transcend(G, p, c); return; } // CR 8.5.48

/* ---------- Combat (CR 7) ---------- */
async function combat(G, first) {

    if (isIllu(L.src)) { p.illuAtk++; L.illuFirst = p.illuAtk === 1; }
    if (L.ally && L.ally.dragon) { p.dragonAtk++; L.dragonFirst = p.dragonAtk === 1; }
    G.log(`${p.name} attaque avec ${L.isWeapon || L.ally ? L.src.n : cname(L.src)}${L.target && L.target.ally ? ' (cible : ' + L.target.ally.n + ')' : L.target && L.target.spectra ? ' (cible : ' + L.target.spectra.card.n + ')' : ''}.`, 'atk');

    }
    G.step = { name: 'attack', L }; G.upd(); await G.pause(350);
    await priority(G, { step: 'attack', L });
    if (L.killed) break;
    G.step = { name: 'defend', L };
    await defendStep(G, L);
    await priority(G, { step: 'defend', L });
    if (L.killed) { G.log('L’attaque a été détruite par phantasm avant les dégâts : la chaîne de combat se ferme (CR 8.3.13b).', 'sys'); break; }
    G.step = { name: 'reaction', L };
    await priority(G, { step: 'reaction', L });
    G.step = { name: 'damage', L };
    await damageStep(G, L);
    await priority(G, { step: 'damage', L });
    G.step = { name: 'resolution', L };
    if (L.src.onLinkResolve) L.src.onLinkResolve(G, L); // CR 7.6.2 : « quand ce maillon se résout »
    if (p.noAbil <= 0 && p.hero.onLinkResolve) p.hero.onLinkResolve(G, p, L); // Nuu : attaques avec stealth
    if (G.trig.length) await resolveNoPriority(G);
    if (goAgain(G, L)) { p.ap += 1; L.goDone = true; }
    G.upd();
    const ctx = { step: 'resolution', L };
    await priority(G, ctx);
    L = ctx.next || null;
  }
  closeChain(G);
}
function killingCount(p) { return p.susp.filter(s => s.card.killing).length; }

}

/* ---------- Réglages mémorisés ---------- */
const READY = Object.values(F.DECKS).filter(d => d.ready).map(d => d.id);
const DEF_CFG = { my: 'grindstone', bot: 'random', botDrawn: null, out: {}, eq: {}, speed: 'normal', think: 'normal' };
let cfg = Object.assign({}, DEF_CFG, store.get('fab-bot-v3', {}));
if (!F.DECKS[cfg.my] || !F.DECKS[cfg.my].ready) cfg.my = READY[0];
function saveCfg() { store.set('fab-bot-v3', cfg); }
function botDeckId() {
  if (cfg.bot !== 'random') return cfg.bot;

}
const mk2 = (a, b) => a + '>' + b;
function myOut() { const k = mk2(cfg.my, botDeckId()); if (!cfg.out[k]) cfg.out[k] = Object.assign({}, F.deckPlan(cfg.my, botDeckId()).out); return cfg.out[k]; }
function myEq() { const k = mk2(cfg.my, botDeckId()); if (!cfg.eq[k]) cfg.eq[k] = F.defaultEq(cfg.my, botDeckId()); return cfg.eq[k]; }
// Étape E : étiquette du plan de side appliqué (archétype adverse ; signale un plan par défaut faute de plan pour cet archétype).

/* ---------- État de l'interface ---------- */
let G = null, pend = null, sel = null, view = 'setup', thinking = '', pvItem = null, skipTurn = -1, logStick = true;
let H = [], PV = [];

const pvReg = item => { PV.push(item); return PV.length - 1; };

const app = document.getElementById('app'), overlay = document.getElementById('overlay');

let rq = false;
function schedule() { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); }
function ask(req) {
  return new Promise((resolve, reject) => {
    pend = Object.assign(req, {
      resolve: v => { pend = null; sel = null; render(); resolve(v); },
      cancel: () => { pend = null; sel = null; render(); reject(new F.Cancel()); },
    });
    if (pend.kind === 'pay') pend.picks = [];
    if (pend.kind === 'defend') { pend.hand = []; pend.eq = []; pend.ars = false; }
    if (pend.kind === 'order' || pend.kind === 'putback' || pend.kind === 'many') pend.picked = [];
    thinking = '';
    render();
  });
}
const ME = () => G.players[0], BOT = () => G.players[1];
const isInstantOpt = o => o.type === 'eq' || (o.type === 'play' && (o.inst || o.card.t === 'I' || o.card.t === 'IA'));
function ownWindow(G, p, ctx) { return G.players[G.active] === p && !G.stack.length && ((ctx.step === 'action' && !G.chainOpen) || (ctx.step === 'resolution' && p.ap > 0)); }
const human = {
  chooseFirst: () => ask({ kind: 'choose', title: 'Tu gagnes le tirage au sort. Qui commence ?', opts: [{ label: 'Je commence', v: true }, { label: 'Le bot commence', v: false }] }).then(o => o.v),
  priority: (G, p, ctx, opts) => {
    // La page ne t'arrête que si tu as un coup jouable qui compte (les instants « sans cible » ne t'arrêtent que dans tes fenêtres d'action)
    if (!ownWindow(G, p, ctx) && opts.every(o => o.quiet)) return Promise.resolve(null);
    if (skipTurn === G.turn && opts.every(isInstantOpt)) return Promise.resolve(null);
    return ask({ kind: 'prio', ctx, opts });
  },
  payPitch: (G, p, need, ex, label) => ask({ kind: 'pay', need, ex, label }),
  defend: (G, p, L) => ask({ kind: 'defend', L }),
  choose: (G, p, kind, opts, title) => ask({ kind: 'choose', title, opts }),
  arsenal: () => ask({ kind: 'arsenal' }),
  heave: (G, p, c) => ask({ kind: 'choose', title: `Heave ${c.heave} : payer ${c.heave} pour mettre ${F.cname(c)} face visible en arsenal et créer ${c.heave} Seismic Surge ?`, opts: [{ label: 'Oui, heave', v: true }, { label: 'Non', v: false }] }).then(o => o.v),
  pickCard: (G, p, cards, kind, title) => ask({ kind: 'pick', cards, title }),
  putBack: (G, p, X) => ask({ kind: 'putback', X }),
  pickMany: (G, p, cards, max, title) => ask({ kind: 'many', cards, max, title }),
  pitchOrder: (G, p, cards) => ask({ kind: 'order', cards }),
  orderCards: (G, p, cards, title) => ask({ kind: 'order', cards, title }),

function wrapBot(bot, name) {
  const out = {};
  for (const k of Object.keys(bot)) out[k] = async (...a) => { thinking = name + ' réfléchit…'; schedule(); return bot[k](...a); };
  return out;
}

/* ---------- Démarrage ---------- */
function deckSpec(deckId, vsId, out, eq, name, isBot) {
  const d = F.DECKS[deckId];

}
function names(myId, botId) {
  const a = F.HERO[F.DECKS[myId].hero].short, b = F.HERO[F.DECKS[botId].hero].short;
  return a === b ? [a + ' (toi)', b + ' (bot)'] : [a, b];
}
function startGame() {
  pend = null; sel = null; overlay.innerHTML = ''; pvItem = null; skipTurn = -1; logStick = true;
  const bId = botDeckId();
  const factor = cfg.speed === 'fast' ? 0.35 : 1;
  const [n1, n2] = names(cfg.my, bId);
  const botPlan = F.deckPlan(bId, cfg.my);
  G = F.Game({
    players: [deckSpec(cfg.my, bId, myOut(), myEq(), n1, false), deckSpec(bId, cfg.my, botPlan.out, F.defaultEq(bId, cfg.my), n2, true)],
    agents: [human, wrapBot(F.makeBot(n2, F.THINK[cfg.think] || F.THINK.normal), n2)],
    pause: ms => new Promise(r => { schedule(); setTimeout(r, ms * factor); }),
    onLog: () => schedule(), onUpdate: () => schedule(),
  });
  G.log(`Ton deck : ${F.DECKS[cfg.my].name}. Le bot joue ${F.DECKS[bId].name}${cfg.bot === 'random' ? ' (tiré au sort)' : ''}.`, 'sys');
  view = 'game';
  const slugs = [];
  for (const p of G.players) {
    slugs.push(p.hero.img);
    p.deck.concat(p.hand).forEach(c => slugs.push(c.img));
    Object.values(p.eq).forEach(e => slugs.push(e.img)); p.weapons.forEach(w => slugs.push(w.img));
  }
  Object.values(F.TOKEN).forEach(t => slugs.push(t.img));
  for (const p of G.players) (F.DECKS[p.deckId].extraImgs || []).forEach(s => slugs.push(s));
  preloadImgs(slugs);

  F.runGame(G).then(w => { thinking = ''; render(); showEnd(w); }).catch(err => { console.error(err); thinking = 'Erreur du moteur : ' + err.message; render(); });
}
function showEnd(w) {

  overlay.innerHTML = `<div class="over"><div class="box" role="dialog" aria-modal="true">
    <h2>${w ? (won ? 'Victoire !' : 'Victoire du bot') : 'Égalité'}</h2>
    <p class="muted">${G.turn} tours. ${esc(a.name)} finit à ${Math.max(0, a.hp)} PV, ${esc(b.name)} à ${Math.max(0, b.hp)} PV.</p>
    <p>Tu as infligé <b class="num">${a.stats.dealt}</b> dégâts et empêché <b class="num">${a.stats.prevented}</b> dégâts en bloquant (${a.stats.blockCards} cartes de ta main, ${a.stats.blockEq} blocs d’équipement).</p>
    <div class="btns"><button class="btn primary" data-end="replay">Rejouer${cfg.bot === 'random' ? ' (nouveau tirage)' : ''}</button><button class="btn" data-end="setup">Changer de deck</button><button class="btn quiet" data-end="log">Voir le journal</button></div>
  </div></div>`;
  const acts = {

  const first = overlay.querySelector('[data-end]'); if (first) first.focus();
}

// Consulter le cimetière ou la zone de bannissement d'un joueur (fenêtre, la partie reste en pause côté affichage)
function showZone(idx, zone) {

/* ---------- Cartes ---------- */
// c : carte du moteur, ou objet { n, img, t, def, pow, fr } pour héros, équipement, arme, jeton, allié.
function cardHTML(c, o = {}) {
  const size = o.size || 'big';
  if (o.back) return `<div class="cd ${size} back" aria-label="Carte face cachée"></div>`;
  const cls = ['cd', size, c.p ? 'p' + c.p : '', o.playable ? 'playable' : '', o.sel ? 'sel' : '', o.on ? 'on' : '', o.dim ? 'dim' : '', o.dead ? 'dead' : '', o.used ? 'used' : '', o.tapped ? 'tapped' : '', o.h !== undefined ? 'click' : ''].join(' ');
  const kws = [];
  if (c.crush) kws.push('Crush'); if (c.dominate) kws.push('Dominate'); if (c.go) kws.push('Go again'); if (c.heave) kws.push('Heave ' + c.heave);
  if (c.susp) kws.push('Suspense'); if (c.clashKw) kws.push('Clash');
  if (c.comboKw) kws.push('Combo'); if (c.ambush) kws.push('Ambush'); if (c.ephemeral) kws.push('Éphémère');
  if (c.phantasm || c.dragon) kws.push('Phantasm'); if (c.ward) kws.push('Ward ' + c.ward); if (c.spectra) kws.push('Spectra'); if (c.legendary) kws.push('Légendaire'); if (c.aura) kws.push('Aura');
  const showCost = ['AA', 'A', 'AR', 'DR', 'I', 'IA'].includes(c.t);
  const pv = pvReg({ c, note: o.note || '' });
  const attrs = o.h !== undefined ? `role="button" tabindex="0" data-h="${o.h}"` : '';
  const pow = o.pow !== undefined ? o.pow : c.pow, dfn = o.def !== undefined ? o.def : c.def;
  const src = c.img ? imgUrl(c.img, 'normal') : '';
  return `<div class="${cls}" ${attrs} data-pv="${pv}" aria-label="${esc(F.cname(c))}">
    <div class="face">
      <div class="f-top">${showCost ? `<span>${c.cost || 0}</span>` : '<span></span>'}<span class="f-pips">${'<i></i>'.repeat(c.p || 0)}</span></div>
      <div class="f-nm">${esc(c.n)}</div>
      <div class="f-ty">${esc(TYPE[c.t] || '')}${c.cls && c.cls !== 'Generic' ? ' · ' + esc(c.cls) : ''}</div>
      ${kws.length ? `<div class="f-kw">${kws.join(' · ')}</div>` : ''}
      <div class="f-bot"><span>${pow !== null && pow !== undefined ? SW + pow : ''}</span><span>${dfn !== null && dfn !== undefined ? SH + dfn : ''}</span></div>
    </div>
    ${src ? `<img src="${src}" alt="" loading="lazy" onerror="this.remove()">` : ''}
    ${o.badge ? `<span class="bdg">${o.badge}</span>` : ''}${o.badgeTL ? `<span class="bdg tl">${o.badgeTL}</span>` : ''}
  </div>`;
}
function eqCard(p, e, o = {}) {

  const info = F.EQ[e.n];
  if (info.noDef) return cardHTML({ n: e.n, img: e.img, t: 'EQ', def: null, fr: info.fr }, Object.assign({ size: 'micro', dead: e.dead, badge: e.dead ? '' : (info.ward ? 'Ward ' + info.ward : ''), note: `${SLOTFR[e.slot]}. Pas de valeur de défense : il ne défend pas.${e.dead ? ' — détruit' : ''}` }, o));
